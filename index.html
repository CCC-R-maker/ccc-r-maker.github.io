<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>HTML Calendar Table</title>
  <style>
    .calendar {
      width: 100%;
      max-width: 600px;
      border-collapse: collapse;
      font-family: Arial, sans-serif;
    }
    .calendar caption {
      font-size: 1.5rem;
      font-weight: bold;
      margin-bottom: 10px;
    }
    .calendar th, .calendar td {
      border: 1px solid #ddd;
      width: 14.28%; /* 100% divided by 7 days */
      text-align: center;
      padding: 12px;
    }
    .calendar th {
      background-color: #f4f4f4;
      font-weight: bold;
    }
    .calendar td {
      height: 60px;
      vertical-align: top;
      text-align: right;
    }
    .calendar .empty {
      background-color: #fafafa;
    }
    .calendar .today {
      background-color: #e6f3ff;
      font-weight: bold;
      color: #0066cc;
    }
  </style>
</head>
<body>

  <table class="calendar">
    <caption>November 2026</caption>
    <thead>
      <tr>
        <th scope="col">Sun</th>
        <th scope="col">Mon</th>
        <th scope="col">Tue</th>
        <th scope="col">Wed</th>
        <th scope="col">Thu</th>
        <th scope="col">Fri</th>
        <th scope="col">Sat</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>1</td>
        <td>2</td>
        <td>3</td>
        <td>4</td>
        <td>5</td>
        <td>6</td>
        <td>7</td>
      </tr>
      <tr>
        <td>8</td>
        <td>9</td>
        <td>10</td>
        <td>11</td>
        <td>12</td>
        <td>13</td>
        <td>14</td>
      </tr>
      <tr>
        <td>15</td>
        <td>16</td>
        <td>17</td>
        <td>18</td>
        <td>19</td>
        <td>20</td>
        <td>21</td>
      </tr>
      <tr>
        <td>22</td>
        <td class="today">23</td>
        <td>24</td>
        <td>25</td>
        <td>26</td>
        <td>27</td>
        <td>28</td>
      </tr>
      <tr>
        <td>29</td>
        <td>30</td>
        <td class="empty"></td>
        <td class="empty"></td>
        <td class="empty"></td>
        <td class="empty"></td>
        <td class="empty"></td>
      </tr>
    </tbody>
  </table>

</body>
</html>
